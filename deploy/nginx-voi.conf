# RunCloud nginx vhost for voi.flance.info (Uzbek plant-doctor voice agent).
# Install as /etc/nginx-rc/conf.d/voi-flance-info.conf
# (mirrors the yandex-nigora / google-azure-vagent vhosts on the same box).
# Static client served from /opt/voiceagent-google/frontend/test-client;
# /ws/voice proxied to the backend container on 127.0.0.1:8014.
# Issue the cert AFTER the DNS A record (voi.flance.info -> 217.216.49.28)
# resolves:  certbot certonly --webroot -w /opt/RunCloud/letsencrypt -d voi.flance.info

map $http_upgrade $voi_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name voi.flance.info;
    listen 80;
    listen [::]:80;

    location ~ /.well-known/acme-challenge {
        auth_basic off;
        allow all;
        log_not_found off;
        root /opt/RunCloud/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    server_name voi.flance.info;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate     /etc/letsencrypt/live/voi.flance.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voi.flance.info/privkey.pem;
    ssl_prefer_server_ciphers on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM";
    ssl_ecdh_curve secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_dhparam /etc/nginx-rc/dhparam.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static demo client (synced repo).
    root /opt/voiceagent-google/frontend/test-client;
    index index.html;

    # Private: the whole static site (test client + hosted APK) is behind HTTP
    # Basic Auth. The mobile app is NOT affected — /ws/voice and /health are
    # separate location blocks below with no auth. Create/edit the user file:
    #   htpasswd -bB /etc/nginx-rc/voi.htpasswd <user> <password>
    location / {
        auth_basic "Growz AI — private";
        auth_basic_user_file /etc/nginx-rc/voi.htpasswd;
        try_files $uri $uri/ =404;
    }

    # WebSocket voice stream -> backend container. Long timeouts + no buffering
    # because audio is long-lived binary streaming (a quiet listener must not be
    # cut, and frames must pass through without coalescing).
    location /ws/voice {
        proxy_pass http://127.0.0.1:8014;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $voi_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8014;
        proxy_set_header Host $host;
    }

    # Crop catalogue for the mobile picker (read-only Growz proxy). Like
    # /ws/voice and /health, the app must reach it without Basic Auth.
    location = /crops {
        proxy_pass http://127.0.0.1:8014;
        proxy_set_header Host $host;
    }

    # Multichat REST (list / create / history) for the mobile app. Prefix match
    # covers /chats, /chats?user_id=… and /chats/{id}. No Basic Auth (same as
    # /crops); the endpoints do their own per-device ownership checks.
    location ^~ /chats {
        proxy_pass http://127.0.0.1:8014;
        proxy_set_header Host $host;
    }

    # APK download for testers/stakeholders — no Basic Auth so the link works
    # from any phone. Served from frontend/test-client/download; forces the
    # Android package MIME type and an attachment filename so the browser
    # downloads (not renders) it. Public link: https://voi.flance.info/download/voiceagent.apk
    location ^~ /download {
        auth_basic off;
        root /opt/voiceagent-google/frontend/test-client;
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="voiceagent.apk"';
    }

    # Photo upload (POST /photos) and serving (GET /photos/{user}/{chat}/{name}).
    # The app uploads every diagnosis photo here and the backend fetches it back,
    # so — like /ws/voice, /health, /crops, /chats — it must bypass Basic Auth.
    # Prefix match covers both the POST and the GET serving route. The endpoint
    # validates the device id and caps size itself. Raise the body limit so a
    # base64 photo (up to ~2 MB decoded) is not rejected by nginx first.
    location ^~ /photos {
        auth_basic off;
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8014;
        proxy_set_header Host $host;
    }
}
